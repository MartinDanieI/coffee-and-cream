<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee & Cream</title>
    
    <!-- Importamos Tailwind CSS para el diseño responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importamos Iconos (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Estilos -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Playfair Display', serif;
            background-color: #a85f2fd1;
        }
        
        .bg-coffee-latte {
            background-color: #d4c5b5;
        }

        /* Animaciones suaves */
        .img-container {
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .img-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        /* Efecto Zoom en la miniatura */
        .helado-img {
            transition: transform 0.6s ease;
        }
        .img-container:hover .helado-img {
            transform: scale(1.1);
        }

        /* Animación de entrada para el lightbox */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .animate-zoomIn {
            animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

    <!-- HEADER COMPACTO -->
    <header class="py-3 text-center bg-white shadow-sm sticky top-0 z-50 border-b border-stone-200">
        <div class="flex items-center justify-center gap-2 mb-1 px-4">
            <i data-lucide="coffee" class="text-amber-800 w-6 h-6"></i>
            <h1 class="text-xl md:text-2xl font-black tracking-widest text-amber-950 uppercase truncate">
                Coffee <span class="text-amber-600">&</span> Cream
            </h1>
        </div>
        <div class="w-12 h-0.5 bg-amber-600 mx-auto rounded-full"></div>
        
    </header>

    <!-- GALERÍA -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 pb-12">
        <div id="galeria-helados" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 sm:gap-8">
            <!-- Las imágenes se insertan aquí con JavaScript -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-6 bg-coffee-latte border-t border-stone-300 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="text-stone-900 text-sm md:text-base font-bold tracking-wide">
                2025 - Martin Daniel Betancourt Plazas
            </p>
        </div>
    </footer>

    <!-- LIGHTBOX (VISOR DE PANTALLA COMPLETA) - OCULTO POR DEFECTO -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/95 hidden items-center justify-center p-4 backdrop-blur-sm cursor-zoom-out" onclick="cerrarLightbox()">
        
        <!-- Botón de Cerrar -->
        <button class="absolute top-4 right-4 text-white/70 hover:text-white transition-colors z-20 p-2 bg-black/20 rounded-full hover:bg-black/40">
            <i data-lucide="x" class="w-8 h-8 md:w-10 md:h-10"></i>
        </button>

        <!-- Contenedor de la imagen ampliada -->
        <div class="relative max-w-full max-h-full flex items-center justify-center" onclick="event.stopPropagation()">
            <img 
                id="lightbox-img" 
                src="" 
                alt="Vista ampliada" 
                class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl cursor-default"
            >
            <!-- Nota visual pequeña -->
            <div class="absolute bottom-[-40px] left-0 right-0 text-center text-white/50 text-sm pointer-events-none font-sans">
                Toca fuera para cerrar
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- ZONA DE CONFIGURACIÓN ---
        const carpeta = "imagenes"; 
        const extension = ".jpg"; 
        const totalHelados = 53;

        // --- MANEJO DE IMÁGENES ---
        function manejarErrorImagen(img) {
            if (img.src.includes('.jpg')) {
                img.src = img.src.replace('.jpg', '.png');
            } else {
                img.onerror = null; 
                img.parentElement.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-stone-400 p-2"><i data-lucide="image-off" class="w-8 h-8 mb-2 opacity-50"></i><span class="text-xs text-center">Sin imagen</span></div>';
                lucide.createIcons(); 
            }
        }

        // --- LÓGICA DEL LIGHTBOX (VISOR) ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Función para abrir
        // Recibe la URL directamente desde el elemento que fue clickeado
        function abrirLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex', 'animate-fadeIn');
            lightboxImg.classList.add('animate-zoomIn');
            // Bloquear scroll del body
            document.body.style.overflow = 'hidden';
        }

        // Función para cerrar
        function cerrarLightbox() {
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex', 'animate-fadeIn');
            lightboxImg.classList.remove('animate-zoomIn');
            lightboxImg.src = ''; // Limpiar src
            // Reactivar scroll del body
            document.body.style.overflow = '';
        }

        // Cerrar con tecla ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                cerrarLightbox();
            }
        });

        // --- GENERACIÓN DE LA GALERÍA ---
        const galeria = document.getElementById('galeria-helados');
        const listaImagenes = [];
        
        for (let i = 1; i <= totalHelados; i++) {
            listaImagenes.push(`${carpeta}/helado${i}${extension}`);
        }
        
        listaImagenes.forEach((url, index) => {
            // Nota: Agregué onclick en el div contenedor
            // this.querySelector('img').src asegura que tomemos la URL final (incluso si cambió a PNG)
            const cardHTML = `
                <div 
                    onclick="abrirLightbox(this.querySelector('img').src)"
                    class="aspect-square bg-white rounded-3xl p-2 sm:p-3 shadow-sm img-container cursor-pointer overflow-hidden group hover:ring-4 hover:ring-amber-100 transition-all"
                    title="Click para ampliar"
                >
                    <div class="w-full h-full rounded-2xl overflow-hidden relative bg-stone-100 flex items-center justify-center">
                        <img 
                            src="${url}" 
                            alt="Helado ${index + 1}" 
                            class="w-full h-full object-cover helado-img"
                            onerror="manejarErrorImagen(this)"
                        >
                        <!-- Icono de lupa que aparece al hacer hover -->
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100">
                            <i data-lucide="maximize-2" class="text-white w-8 h-8 drop-shadow-lg transform scale-50 group-hover:scale-100 transition-transform duration-300"></i>
                        </div>
                    </div>
                </div>
            `;
            galeria.innerHTML += cardHTML;
        });
        
        // Re-inicializar iconos para los nuevos elementos agregados
        lucide.createIcons();
    </script>
</body>
</html>
